<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixturas - DMF Industrial</title>

<!-- Fuentes y estilos -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  :root {
    --morado: #4b0082;
    --morado-claro: #6a0dad;
    --negro: #111;
    --blanco: #fff;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    margin: 0;
    color: var(--blanco);
    background: url("fondo-industrial2.jpg") no-repeat center center fixed;
    background-size: cover;
    overflow-x: hidden;
  }

  /* ---------- HEADER ---------- */
  header {
    background-color: var(--morado);
    color: var(--blanco);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 8%;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  header img {
    height: 45px;
    width: auto;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 1px;
  }

  nav {
    display: flex;
    gap: 20px;
  }

  nav a {
    color: var(--blanco);
    text-decoration: none;
    font-weight: 600;
    position: relative;
    transition: color 0.3s;
  }

  nav a::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0%;
    height: 2px;
    background: var(--blanco);
    transition: width 0.3s;
  }

  nav a:hover {
    color: var(--morado-claro);
  }

  nav a:hover::after {
    width: 100%;
  }

  /* ---------- CONTENIDO ---------- */
  main {
    min-height: 100vh;
    padding: 50px 0 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h2 {
    text-align: center;
    color: var(--blanco);
    font-size: 2rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    margin-bottom: 40px;
  }

  /* ---------- GALERÍA ---------- */
 
.galeria {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    column-gap: 25px; /* espacio horizontal */
    row-gap: 40px; /* espacio vertical */
    width: 100%;
    max-width: 1300px; /* ✅ ancho máximo para centrar */
    margin: 0 auto; /* ✅ centra la galería */
    justify-items: center;
}


  .galeria-item {
    text-align: center;
  }

  .nombre-fixtura {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--blanco);
    margin-bottom: 8px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  .galeria img {
    width: 210px;
    height: 170px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .galeria img:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }

  /* ---------- LIGHTBOX ---------- */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #lightboxMain, #lightboxVideo {
    max-width: 90%;
    max-height: 70%;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
  }

  #lightboxVideo { display: none; }

  #lightbox .close {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 2rem;
    color: var(--blanco);
    cursor: pointer;
    transition: color 0.3s;
  }

  #lightbox .close:hover { color: var(--morado-claro); }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    color: var(--blanco);
    cursor: pointer;
    padding: 10px;
    transition: color 0.3s, transform 0.2s;
    user-select: none;
  }

  .arrow:hover {
    color: var(--morado-claro);
    transform: translateY(-50%) scale(1.1);
  }

  .arrow-left { left: 20px; }
  .arrow-right { right: 20px; }

  #lightboxThumbnails {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
  }

  #lightboxThumbnails img {
    width: 80px;
    height: 60px;
    object-fit: cover;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0.8;
    transition: transform 0.2s, opacity 0.2s;
  }

  #lightboxThumbnails img:hover {
    transform: scale(1.1);
    opacity: 1;
  }

  /* ---------- BOTÓN SUBIR ---------- */
  #topBtn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background-color: var(--morado);
    color: var(--blanco);
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 1000;
    display: none;
    transition: background 0.3s, transform 0.2s;
  }

  #topBtn:hover {
    background-color: var(--morado-claro);
    transform: scale(1.1);
  }

  /* ---------- FOOTER ---------- */
  footer {
    text-align: center;
    padding: 25px;
    background-color: var(--negro);
    color: #ccc;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
  }

  @media (max-width: 1000px) {
    .galeria {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 700px) {
    .galeria {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 480px) {
    .galeria {
      grid-template-columns: 1fr;
    }
    .galeria img {
      width: 80%;
      height: auto;
    }
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo DMF Industrial">
  <h1>Fixturas - DMF Industrial</h1>
  <nav>
    <a href="index.html"><i class="fa fa-home"></i> Inicio</a>
    <a href="index.html#servicios"><i class="fa fa-cogs"></i> Servicios</a>
  </nav>
</header>

<main>
  <h2>Nuestra Galería de Fixturas</h2>

  <div class="galeria">
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 1</h3><img src="fixtura1_1.jpg" alt="Fixtura 1" data-group="fixtura1"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 2</h3><img src="fixtura2_1.jpg" alt="Fixtura 2" data-group="fixtura2"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 3</h3><img src="fixtura3_1.jpg" alt="Fixtura 3" data-group="fixtura3"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 4</h3><img src="fixtura4_1.jpg" alt="Fixtura 4" data-group="fixtura4"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 5</h3><img src="fixtura5_1.jpg" alt="Fixtura 5" data-group="fixtura5"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 6</h3><img src="fixtura6_1.jpg" alt="Fixtura 6" data-group="fixtura6"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 7</h3><img src="fixtura7_1.jpg" alt="Fixtura 7" data-group="fixtura7"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 8</h3><img src="fixtura8_1.jpg" alt="Fixtura 8" data-group="fixtura8"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 9</h3><img src="fixtura9_1.jpg" alt="Fixtura 9" data-group="fixtura9"></div>
    <div class="galeria-item"><h3 class="nombre-fixtura">Fixtura 10</h3><img src="fixtura10_1.jpg" alt="Fixtura 10" data-group="fixtura10"></div>
  </div>
</main>

<!-- Lightbox -->
<div id="lightbox">
  <span class="close" onclick="cerrarLightbox()">&times;</span>
  <i class="fas fa-chevron-left arrow arrow-left" onclick="prevMedia()"></i>
  <i class="fas fa-chevron-right arrow arrow-right" onclick="nextMedia()"></i>
  <img id="lightboxMain" src="" alt="">
  <video id="lightboxVideo" controls></video>
  <div id="lightboxThumbnails"></div>
</div>

<button id="topBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">↑</button>

<footer>
  <p>&copy; 2025 DMF Industrial | Todos los derechos reservados</p>
</footer>

<script>
const galeria = document.querySelectorAll('.galeria img');
const lightbox = document.getElementById('lightbox');
const lightboxMain = document.getElementById('lightboxMain');
const lightboxVideo = document.getElementById('lightboxVideo');
const lightboxThumbs = document.getElementById('lightboxThumbnails');
const topBtn = document.getElementById('topBtn');

const mediaByGroup = {
  fixtura1: { images: ["fixtura1_1.jpg","fixtura1_2.jpg","fixtura1_3.jpg"], video: "fixtura1_video.mp4" },
  fixtura2: { images: ["fixtura2_1.jpg","fixtura2_2.jpg","fixtura2_3.jpg"], video: "fixtura2_video.mp4" },
  fixtura3: { images: ["fixtura3_1.jpg","fixtura3_2.jpg","fixtura3_3.jpg"], video: "fixtura3_video.mp4" },
  fixtura4: { images: ["fixtura4_1.jpg","fixtura4_2.jpg","fixtura4_3.jpg"], video: "fixtura4_video.mp4" },
  fixtura5: { images: ["fixtura5_1.jpg","fixtura5_2.jpg","fixtura5_3.jpg"], video: "fixtura5_video.mp4" },
  fixtura6: { images: ["fixtura6_1.jpg","fixtura6_2.jpg","fixtura6_3.jpg"], video: "fixtura6_video.mp4" },
  fixtura7: { images: ["fixtura7_1.jpg","fixtura7_2.jpg","fixtura7_3.jpg"], video: "fixtura7_video.mp4" },
  fixtura8: { images: ["fixtura8_1.jpg","fixtura8_2.jpg","fixtura8_3.jpg"], video: "fixtura8_video.mp4" },
  fixtura9: { images: ["fixtura9_1.jpg","fixtura9_2.jpg","fixtura9_3.jpg"], video: "fixtura9_video.mp4" },
  fixtura10: { images: ["fixtura10_1.jpg","fixtura10_2.jpg","fixtura10_3.jpg"], video: "fixtura10_video.mp4" }
};

let currentMedia = [];
let currentIndex = 0;

galeria.forEach(img => {
  img.addEventListener('click', () => {
    const groupName = img.dataset.group;
    const data = mediaByGroup[groupName];
    currentMedia = [...data.images];
    if (data.video) currentMedia.push(data.video);
    currentIndex = 0;
    showLightbox();
  });
});

function showLightbox() {
  updateMedia();
  lightboxThumbs.innerHTML = '';
  currentMedia.forEach((src, idx) => {
    if (src.endsWith(".mp4")) return;
    const thumb = document.createElement('img');
    thumb.src = src;
    thumb.alt = `Ángulo ${idx+1}`;
    thumb.addEventListener('click', () => {
      currentIndex = idx;
      updateMedia();
    });
    lightboxThumbs.appendChild(thumb);
  });
  lightbox.style.display = 'flex';
}

function updateMedia() {
  const src = currentMedia[currentIndex];
  if (src.endsWith(".mp4")) {
    lightboxMain.style.display = 'none';
    lightboxVideo.style.display = 'block';
    lightboxVideo.src = src;
    lightboxVideo.play();
  } else {
    lightboxVideo.pause();
    lightboxVideo.style.display = 'none';
    lightboxVideo.src = '';
    lightboxMain.style.display = 'block';
    lightboxMain.src = src;
  }
}

function prevMedia() {
  currentIndex = (currentIndex - 1 + currentMedia.length) % currentMedia.length;
  updateMedia();
}

function nextMedia() {
  currentIndex = (currentIndex + 1) % currentMedia.length;
  updateMedia();
}

function cerrarLightbox() {
  lightbox.style.display = 'none';
  lightboxVideo.pause();
  lightboxVideo.src = '';
  lightboxMain.src = '';
  lightboxThumbs.innerHTML = '';
  currentMedia = [];
  currentIndex = 0;
}

lightbox.addEventListener('click', e => { if (e.target === lightbox) cerrarLightbox(); });

window.onscroll = () => {
  topBtn.style.display = (window.scrollY > 300) ? 'block' : 'none';
};
</script>

</body>
</html>
